<!DOCTYPE html>
<!-- build: quiz + animated explosions -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Space Fight</title>
    <style>
        html {
            height: 100%;
            overscroll-behavior: none;
        }
        body {
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }
        #game-container {
            position: relative;
            height: 96dvh;
            aspect-ratio: 9 / 16;
            max-width: 96vw;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #hud {
            position: absolute;
            top: 8px; left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: clamp(12px, 3.4vw, 16px);
            text-shadow: 0 2px 4px #000;
            pointer-events: none;
        }
        #lives { letter-spacing: 4px; }
        #quizBanner {
            position: absolute;
            top: 34px; left: 10px; right: 10px;
            text-align: center;
            font-size: clamp(12px, 3.6vw, 16px);
            line-height: 1.3;
            color: #fff9d6;
            text-shadow: 0 2px 4px #000;
            pointer-events: none;
        }
        #feedback {
            position: absolute;
            top: 84px; left: 0; right: 0;
            text-align: center;
            font-size: clamp(14px, 4.4vw, 19px);
            font-weight: bold;
            text-shadow: 0 2px 4px #000;
            pointer-events: none;
            transition: opacity 0.25s;
        }
        #feedback.hidden { opacity: 0; }
        #feedback.good { color: #7CFC9A; }
        #feedback.bad { color: #ff8f7a; }
        #funFact {
            position: absolute;
            left: 14px; right: 14px; bottom: 96px;
            background: rgba(10, 12, 34, 0.82);
            border: 1px solid rgba(159, 216, 255, 0.5);
            border-radius: 10px;
            padding: 8px 12px;
            text-align: center;
            font-size: clamp(11px, 3.2vw, 13.5px);
            line-height: 1.35;
            color: #cdeaff;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }
        #funFact.show { opacity: 1; }
        #fireBtn {
            position: absolute;
            right: 16px; bottom: 22px;
            width: 64px; height: 64px;
            border-radius: 50%;
            background: rgba(255,90,60,0.28);
            border: 2px solid rgba(255,140,110,0.8);
            color: #ffd9cc;
            font-size: 11px;
            display: flex; align-items: center; justify-content: center;
            text-align: center;
            touch-action: none;
        }
        #gameOver {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.72);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
            padding: 0 20px;
        }
        #gameOver.hidden { display: none; }
        #gameOver h2 { margin: 0; color: #ff6b5e; font-size: clamp(20px, 6vw, 30px); }
        #gameOver p { margin: 0; color: #9fd8ff; font-size: clamp(12px, 3.6vw, 15px); }
    </style>
</head>
<body>
<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
        <div id="score">SCORE 0</div>
        <div id="lives">&#9650;&#9650;&#9650;</div>
    </div>
    <div id="quizBanner">Get ready...</div>
    <div id="feedback" class="hidden"></div>
    <div id="funFact"></div>
    <div id="fireBtn">FIRE</div>
    <div id="gameOver" class="hidden">
        <h2>SHIP DESTROYED</h2>
        <p id="finalScore"></p>
        <p>Tap to restart</p>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Logical game coordinate space (everything below is written against this,
// regardless of screen size). The canvas's actual backing-store resolution
// is bumped up by devicePixelRatio so the art stays crisp on retina phone
// screens instead of getting blown up and looking blocky - the CSS size
// (set in the stylesheet, 100% of #game-container) is what actually
// determines how big it appears on screen.
const GAME_W = 405, GAME_H = 720;
const DPR = Math.max(1, window.devicePixelRatio || 1);
canvas.width = GAME_W * DPR;
canvas.height = GAME_H * DPR;
ctx.scale(DPR, DPR);

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const gameOverEl = document.getElementById('gameOver');
const finalScoreEl = document.getElementById('finalScore');
const quizBannerEl = document.getElementById('quizBanner');
const feedbackEl = document.getElementById('feedback');
const funFactEl = document.getElementById('funFact');

function loadImage(src) {
    const img = new Image();
    img.src = src;
    return img;
}

// ---------- Parallax starfield background ----------
const layers = [];
function loadLayer(src, speed) {
    layers.push({ img: loadImage(src), speed, y: 0 });
}
loadLayer('assets/backgrounds/layer1_nebula.png', 0.15);
loadLayer('assets/backgrounds/layer2_planets.png', 0.35);
loadLayer('assets/backgrounds/layer3_asteroids.png', 0.55);
loadLayer('assets/backgrounds/layer4_sparkles.png', 0.9);

function drawLayer(layer) {
    const img = layer.img;
    if (!img.complete || !img.naturalWidth) return;
    const scale = GAME_W / img.naturalWidth;
    const h = img.naturalHeight * scale;
    let y = layer.y % h;
    if (y > 0) y -= h;
    for (; y < GAME_H; y += h) {
        ctx.drawImage(img, 0, y, GAME_W, h);
    }
}
function updateLayers(dt) {
    layers.forEach(layer => { layer.y += layer.speed * (dt / 16); });
}

// ---------- Player ship ----------
// Five upgrade tiers. Each tier's engine flame is baked into its own set of
// composite frames (the hull is identical across a tier's frames - only the
// flame length/style changes), so instead of overlaying a separate flame
// sprite we just cycle the tier's own frame set and scale everything by the
// tier's known hull height, keeping the ship's apparent size constant no
// matter how long that tier's flame happens to be in a given frame.
const TIER_COUNT = 5;
const HULL_HEIGHT = [null, 860, 1683, 1070, 950, 971]; // 1-indexed, from each tier's standalone art
const TIER_FRAME_COUNTS = [null, 5, 4, 5, 5, 5];

const tierFrames = [null];
for (let t = 1; t <= TIER_COUNT; t++) {
    const frames = [];
    for (let i = 0; i < TIER_FRAME_COUNTS[t]; i++) {
        frames.push(loadImage(`assets/ship/tier${t}/frame_${i}.png`));
    }
    tierFrames.push(frames);
}

const SHIP_DISPLAY_HEIGHT = 68; // on-screen hull height in canvas px, same for every tier

const player = {
    x: GAME_W / 2,
    y: GAME_H - 110,
    tier: 1,
    speed: 4.5,
    invulnUntil: 0,
};

const FLAME_FRAME_MS = 70;
let flameFrame = 0;
let flameTimer = 0;
function updateFlame(dt) {
    flameTimer += dt;
    const count = TIER_FRAME_COUNTS[player.tier];
    while (flameTimer >= FLAME_FRAME_MS) {
        flameTimer -= FLAME_FRAME_MS;
        flameFrame = (flameFrame + 1) % count;
    }
}

function drawPlayer() {
    const frames = tierFrames[player.tier];
    const img = frames[flameFrame % frames.length];
    if (!img || !img.complete || !img.naturalWidth) return;
    // Blink while invulnerable after taking a hit.
    if (player.invulnUntil > performance.now() && Math.floor(performance.now() / 100) % 2 === 0) return;
    const scale = SHIP_DISPLAY_HEIGHT / HULL_HEIGHT[player.tier];
    const w = img.naturalWidth * scale;
    const h = img.naturalHeight * scale;
    ctx.drawImage(img, player.x - w / 2, player.y - SHIP_DISPLAY_HEIGHT / 2, w, h);
}

function clampPlayer() {
    const half = SHIP_DISPLAY_HEIGHT / 2;
    player.x = Math.min(GAME_W - half, Math.max(half, player.x));
    player.y = Math.min(GAME_H - half, Math.max(half, player.y));
}

// ---------- Bullets ----------
const bulletImg = loadImage('assets/fx/unused_layers/6b1e0621.png');
const BULLET_W = 10, BULLET_H = 26, BULLET_SPEED = 9;
let bullets = [];
let lastShot = 0;
const FIRE_COOLDOWN_MS = 240;

function tryFire(time) {
    if (time - lastShot < FIRE_COOLDOWN_MS) return;
    lastShot = time;
    bullets.push({ x: player.x, y: player.y - SHIP_DISPLAY_HEIGHT / 2 });
}
function updateBullets(dt) {
    bullets.forEach(b => { b.y -= BULLET_SPEED * (dt / 16); });
    bullets = bullets.filter(b => b.y > -BULLET_H);
}
function drawBullets() {
    bullets.forEach(b => {
        ctx.drawImage(bulletImg, b.x - BULLET_W / 2, b.y - BULLET_H / 2, BULLET_W, BULLET_H);
    });
}

// ---------- Asteroids (dodgeable hazards) ----------
const asteroidImgs = [0, 1, 2, 3, 4].map(i => loadImage(`assets/hazards/asteroid_${i}.png`));
const ASTEROID_DISPLAY = 46;
let asteroids = [];
let nextAsteroidAt = 0;

function spawnAsteroid(time) {
    const img = asteroidImgs[Math.floor(Math.random() * asteroidImgs.length)];
    asteroids.push({
        img,
        x: ASTEROID_DISPLAY / 2 + Math.random() * (GAME_W - ASTEROID_DISPLAY),
        y: -ASTEROID_DISPLAY,
        speed: 2 + Math.random() * 1.8,
        spin: (Math.random() - 0.5) * 0.04,
        angle: 0,
        r: ASTEROID_DISPLAY * 0.4,
    });
    nextAsteroidAt = time + 900 + Math.random() * 900;
}
function updateAsteroids(dt, time) {
    if (time > nextAsteroidAt) spawnAsteroid(time);
    asteroids.forEach(a => { a.y += a.speed * (dt / 16); a.angle += a.spin * (dt / 16); });
    asteroids = asteroids.filter(a => a.y < GAME_H + ASTEROID_DISPLAY);
}
function drawAsteroids() {
    asteroids.forEach(a => {
        const img = a.img;
        if (!img.complete || !img.naturalWidth) return;
        const scale = ASTEROID_DISPLAY / Math.max(img.naturalWidth, img.naturalHeight);
        const w = img.naturalWidth * scale, h = img.naturalHeight * scale;
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.angle);
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
        ctx.restore();
    });
}

// ---------- Quiz ships (the educational core: shoot the right answer) ----------
// Space-fact questions for upper-elementary players (ages ~9-11). Each has
// exactly one correct choice among 3; a wave spawns one ship per choice and
// the player has to read them and shoot the right one.
const QUESTIONS = [
    { q: 'Which planet is known as the Red Planet?', choices: ['Mars', 'Venus', 'Jupiter'], correct: 0 },
    { q: 'Which planet is closest to the Sun?', choices: ['Earth', 'Mercury', 'Saturn'], correct: 1 },
    { q: 'What is the largest planet in our solar system?', choices: ['Earth', 'Mars', 'Jupiter'], correct: 2 },
    { q: 'What galaxy is Earth in?', choices: ['Milky Way', 'Andromeda', 'Sombrero'], correct: 0 },
    { q: 'What do we call a rocky object that orbits the Sun?', choices: ['Asteroid', 'Comet', 'Moon'], correct: 0 },
    { q: 'What is the closest star to Earth?', choices: ['Polaris', 'The Sun', 'Proxima b'], correct: 1 },
    { q: 'How many planets are in our solar system?', choices: ['9', '8', '10'], correct: 1 },
    { q: "What makes Earth have day and night?", choices: ['Earth spinning', 'The Sun moving', 'The Moon blocking it'], correct: 0 },
    { q: "What is Earth's only natural satellite?", choices: ['Titan', 'Europa', 'The Moon'], correct: 2 },
    { q: 'Which planet has the easiest rings to see?', choices: ['Saturn', 'Mercury', 'Mars'], correct: 0 },
    { q: 'What do astronauts wear outside their spacecraft?', choices: ['A wetsuit', 'A space suit', 'A snowsuit'], correct: 1 },
    { q: 'What is a "shooting star" actually?', choices: ['A meteor', 'A comet', 'A planet'], correct: 0 },
    { q: "Which planet is famous for its Great Red Spot?", choices: ['Neptune', 'Mars', 'Jupiter'], correct: 2 },
    { q: 'What force keeps planets orbiting the Sun?', choices: ['Wind', 'Gravity', 'Magnetism'], correct: 1 },
    { q: 'Who was the first person to walk on the Moon?', choices: ['Buzz Aldrin', 'John Glenn', 'Neil Armstrong'], correct: 2 },
    { q: 'What do we call a group of stars that forms a pattern?', choices: ['Galaxy', 'Constellation', 'Nebula'], correct: 1 },
    { q: "Which planet is called Earth's twin because it's a similar size?", choices: ['Venus', 'Mars', 'Mercury'], correct: 0 },
    { q: 'What is at the center of our solar system?', choices: ['Earth', 'The Moon', 'The Sun'], correct: 2 },
    { q: "What is the name of NASA's famous space telescope?", choices: ['Hubble', 'Kepler', 'Voyager'], correct: 0 },
    { q: 'What galaxy is heading toward a collision with the Milky Way?', choices: ['Triangulum', 'Andromeda', 'Whirlpool'], correct: 1 },
];

// Ambient trivia that just pops up on its own every so often - not part of
// the quiz, just flavor text tying the floating debris/satellites to real
// facts about them.
const FUN_FACTS = [
    "Did you know? There are over 30,000 pieces of tracked space debris circling Earth right now.",
    "Fun fact: About 3,000 working satellites are orbiting Earth as you play this!",
    "Did you know? Space debris can zoom around Earth at over 17,000 mph.",
    "Fun fact: The International Space Station sometimes has to steer around space junk!",
    "Did you know? The first satellite ever, Sputnik 1, launched all the way back in 1957.",
    "Fun fact: Even a piece of space junk as small as a marble can damage a satellite.",
    "Did you know? Astronauts on the ISS see 16 sunrises and sunsets every single day.",
    "Fun fact: There's no sound in space - no air means nothing to carry the noise!",
    "Did you know? The Moon drifts about 1.5 inches farther from Earth every year.",
    "Fun fact: One day on Venus is longer than one whole year on Venus!",
];
let nextFunFactAt = 0;
let funFactHideTimer = null;
function maybeShowFunFact(time) {
    if (time < nextFunFactAt) return;
    funFactEl.textContent = FUN_FACTS[Math.floor(Math.random() * FUN_FACTS.length)];
    funFactEl.classList.add('show');
    clearTimeout(funFactHideTimer);
    funFactHideTimer = setTimeout(() => funFactEl.classList.remove('show'), 4500);
    nextFunFactAt = time + 16000 + Math.random() * 8000;
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// Quiz targets are tumbling chunks of wrecked-ship debris (cropped from the
// old enemy ship art) rather than a whole enemy ship - less "you're fighting
// a bad guy," more "here's some space junk floating by," which also sets up
// the debris/satellite fun facts below.
const debrisImgs = [0, 1, 2].map(i => loadImage(`assets/hazards/debris/piece_${i}.png`));
const ENEMY_DISPLAY_H = 58;
let quizShips = [];
let questionQueue = [];
let queuePos = 0;
let waveEndAt = 0;   // 0 = no wave currently scheduled to start
let waveIsRetry = false;
let feedbackTimer = null;

function buildQuestionQueue() {
    questionQueue = shuffle(QUESTIONS.map((_, i) => i));
    queuePos = 0;
}
function nextQuestion() {
    if (queuePos >= questionQueue.length) buildQuestionQueue();
    return QUESTIONS[questionQueue[queuePos++]];
}

let currentQuestion = null;
function spawnQuizWave(retry) {
    currentQuestion = retry && currentQuestion ? currentQuestion : nextQuestion();
    quizBannerEl.textContent = currentQuestion.q;
    const options = shuffle(currentQuestion.choices.map((text, i) => ({ text, correct: i === currentQuestion.correct })));
    const slots = [GAME_W * 0.22, GAME_W * 0.5, GAME_W * 0.78];
    quizShips = options.map((o, i) => ({
        x: slots[i],
        y: -ENEMY_DISPLAY_H - i * 55,
        speed: 0.75 + Math.random() * 0.35,
        text: o.text,
        correct: o.correct,
        hit: false,
        r: ENEMY_DISPLAY_H * 0.4,
        img: debrisImgs[Math.floor(Math.random() * debrisImgs.length)],
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.03,
    }));
}

function updateQuizShips(dt) {
    quizShips.forEach(s => { s.y += s.speed * (dt / 16); s.angle += s.spin * (dt / 16); });
    const hadShips = quizShips.length > 0;
    quizShips = quizShips.filter(s => s.y < GAME_H + ENEMY_DISPLAY_H + 60 && !s.hit);
    if (hadShips && quizShips.length === 0 && waveEndAt === 0) {
        // The whole wave drifted off-screen without the correct answer being
        // hit - give the same question another pass rather than moving on.
        waveEndAt = performance.now() + 900;
        waveIsRetry = true;
    }
}
function maybeSpawnQuizWave(time) {
    if (quizShips.length === 0 && waveEndAt && time >= waveEndAt) {
        const retry = waveIsRetry;
        waveEndAt = 0;
        spawnQuizWave(retry);
    }
}

function wrapLines(text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    words.forEach(w => {
        const test = line ? line + ' ' + w : w;
        if (line && ctx.measureText(test).width > maxWidth) { lines.push(line); line = w; }
        else line = test;
    });
    if (line) lines.push(line);
    return lines;
}
function drawLabel(text, cx, topY, maxWidth) {
    ctx.save();
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const lines = wrapLines(text, maxWidth);
    lines.forEach((line, i) => {
        const ly = topY + i * 14;
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(0,0,0,0.9)';
        ctx.strokeText(line, cx, ly);
        ctx.fillStyle = '#fff9d6';
        ctx.fillText(line, cx, ly);
    });
    ctx.restore();
}
function drawQuizShips() {
    quizShips.forEach(s => {
        const img = s.img;
        if (!img.complete || !img.naturalWidth) return;
        // Debris pieces have very different aspect ratios (a tall nose chunk
        // vs. a wide tail chunk), so fit each within a box instead of always
        // scaling by height - otherwise the wide pieces would blow up huge.
        const scale = ENEMY_DISPLAY_H / Math.max(img.naturalWidth, img.naturalHeight);
        const w = img.naturalWidth * scale, h = img.naturalHeight * scale;
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.angle);
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
        ctx.restore();
        drawLabel(s.text, s.x, s.y + h / 2 + 4, Math.max(w, 70) + 30);
    });
}

function showFeedback(text, good) {
    feedbackEl.textContent = text;
    feedbackEl.className = good ? 'good' : 'bad';
    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => feedbackEl.classList.add('hidden'), 1100);
}

// ---------- Explosions (brief effect on hit/kill) ----------
const EXPLOSION_FRAME_COUNT = 10;
const explosionFrames = Array.from({ length: EXPLOSION_FRAME_COUNT }, (_, i) =>
    loadImage(`assets/fx/explosion_anim/frame_${i}.png`));
const EXPLOSION_DURATION_MS = 380;
let explosions = [];
function spawnExplosion(x, y, size) {
    explosions.push({ x, y, size, start: performance.now() });
}
function drawExplosions(time) {
    explosions = explosions.filter(e => time - e.start < EXPLOSION_DURATION_MS);
    explosions.forEach(e => {
        const t = (time - e.start) / EXPLOSION_DURATION_MS;
        const frame = Math.max(0, Math.min(EXPLOSION_FRAME_COUNT - 1, Math.floor(t * EXPLOSION_FRAME_COUNT)));
        const img = explosionFrames[frame];
        if (!img.complete || !img.naturalWidth) return;
        ctx.drawImage(img, e.x - e.size / 2, e.y - e.size / 2, e.size, e.size);
    });
}

// ---------- Score / lives / game state ----------
let score = 0;
let lives = 3;
let gameOver = false;
function updateHud() {
    scoreEl.textContent = 'SCORE ' + score;
    livesEl.textContent = '▲'.repeat(Math.max(0, lives));
}

function loseLife(time) {
    if (player.invulnUntil > time) return;
    lives -= 1;
    player.invulnUntil = time + 1500;
    updateHud();
    if (lives <= 0) {
        gameOver = true;
        finalScoreEl.textContent = 'Score: ' + score;
        gameOverEl.classList.remove('hidden');
    }
}

function resetGame() {
    score = 0;
    lives = 3;
    gameOver = false;
    player.x = GAME_W / 2;
    player.y = GAME_H - 110;
    player.tier = 1;
    player.invulnUntil = 0;
    bullets = [];
    asteroids = [];
    explosions = [];
    nextAsteroidAt = 0;
    quizShips = [];
    buildQuestionQueue();
    currentQuestion = null;
    quizBannerEl.textContent = 'Get ready...';
    feedbackEl.classList.add('hidden');
    clearTimeout(feedbackTimer);
    waveEndAt = performance.now() + 500;
    waveIsRetry = false;
    funFactEl.classList.remove('show');
    clearTimeout(funFactHideTimer);
    nextFunFactAt = performance.now() + 6000 + Math.random() * 4000;
    updateHud();
    gameOverEl.classList.add('hidden');
}

function circleHit(ax, ay, ar, bx, by, br) {
    const dx = ax - bx, dy = ay - by;
    return dx * dx + dy * dy < (ar + br) * (ar + br);
}

function resolveCollisions(time) {
    const playerR = SHIP_DISPLAY_HEIGHT * 0.32;

    // Player vs asteroids
    asteroids.forEach(a => {
        if (circleHit(player.x, player.y, playerR, a.x, a.y, a.r)) {
            loseLife(time);
            spawnExplosion(a.x, a.y, ASTEROID_DISPLAY);
            a.y = GAME_H + 999; // remove next filter pass
        }
    });

    // Bullets vs quiz ships - this is the actual quiz: shoot the one
    // carrying the correct answer.
    bullets.forEach(b => {
        if (b.y < -900) return;
        quizShips.forEach(s => {
            if (s.hit) return;
            if (circleHit(b.x, b.y, 4, s.x, s.y, s.r)) {
                s.hit = true;
                b.y = -999;
                spawnExplosion(s.x, s.y, ENEMY_DISPLAY_H);
                if (s.correct) {
                    score += 50;
                    updateHud();
                    showFeedback('✓ Correct!', true);
                    quizShips.forEach(other => { other.hit = true; }); // clear the rest of the wave
                    waveEndAt = performance.now() + 1400;
                    waveIsRetry = false;
                } else {
                    showFeedback('Not quite - try again!', false);
                }
            }
        });
    });

    // Bullets vs asteroids (asteroids just get blasted away for points too)
    bullets.forEach(b => {
        asteroids.forEach(a => {
            if (circleHit(b.x, b.y, 4, a.x, a.y, a.r)) {
                score += 10;
                spawnExplosion(a.x, a.y, ASTEROID_DISPLAY);
                a.y = GAME_H + 999;
                b.y = -999;
                updateHud();
            }
        });
    });

    bullets = bullets.filter(b => b.y > -999);
    asteroids = asteroids.filter(a => a.y < GAME_H + 900);
}

// ---------- Input ----------
// Keyboard: arrows or WASD to fly, space to fire, 1-5 to preview a tier
// (a stand-in for real power-up pickups, which aren't built yet).
const keys = { up: false, down: false, left: false, right: false, fire: false };
window.addEventListener('keydown', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === ' ') keys.fire = true;
    if (['1','2','3','4','5'].includes(e.key)) { player.tier = parseInt(e.key, 10); flameFrame = 0; }
});
window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === ' ') keys.fire = false;
});

// Touch/mouse: drag anywhere on the canvas to fly the ship straight to
// the pointer, in canvas-space coordinates (accounts for CSS scaling).
let dragging = false;
function pointerToCanvas(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (clientX - rect.left) * (GAME_W / rect.width),
        y: (clientY - rect.top) * (GAME_H / rect.height),
    };
}
canvas.addEventListener('pointerdown', (e) => {
    dragging = true;
    const p = pointerToCanvas(e.clientX, e.clientY);
    player.x = p.x; player.y = p.y;
});
canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const p = pointerToCanvas(e.clientX, e.clientY);
    player.x = p.x; player.y = p.y;
});
window.addEventListener('pointerup', () => { dragging = false; });

const fireBtn = document.getElementById('fireBtn');
fireBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); keys.fire = true; });
fireBtn.addEventListener('pointerup', (e) => { e.preventDefault(); keys.fire = false; });
fireBtn.addEventListener('pointercancel', () => { keys.fire = false; });

gameOverEl.addEventListener('pointerdown', (e) => { e.preventDefault(); resetGame(); });

function updatePlayer(dt) {
    const move = player.speed * (dt / 16);
    if (keys.up) player.y -= move;
    if (keys.down) player.y += move;
    if (keys.left) player.x -= move;
    if (keys.right) player.x += move;
    clampPlayer();
}

function render(time) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    layers.forEach(drawLayer);
    drawAsteroids();
    drawQuizShips();
    drawBullets();
    drawPlayer();
    drawExplosions(time);
}

let lastTime = 0;
function loop(time) {
    const dt = lastTime ? Math.min(time - lastTime, 48) : 16;
    lastTime = time;

    if (!gameOver) {
        updateLayers(dt);
        updatePlayer(dt);
        updateFlame(dt);
        if (keys.fire) tryFire(time);
        updateBullets(dt);
        updateAsteroids(dt, time);
        updateQuizShips(dt);
        resolveCollisions(time);
        maybeSpawnQuizWave(time);
        maybeShowFunFact(time);
    }
    render(time);
    requestAnimationFrame(loop);
}
buildQuestionQueue();
waveEndAt = performance.now() + 500;
nextFunFactAt = performance.now() + 6000 + Math.random() * 4000;
updateHud();
requestAnimationFrame(loop);
</script>
</body>
