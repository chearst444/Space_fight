<!DOCTYPE html>
<!-- build: shoot meteors/space junk, level up every 100 points -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Space Fight</title>
    <style>
        @font-face {
            font-family: 'VaultUI';
            src: url('assets/fonts/VaultUI.ttf') format('truetype');
        }
        html {
            height: 100%;
            overscroll-behavior: none;
        }
        body {
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }
        #game-container {
            position: relative;
            height: 96dvh;
            aspect-ratio: 9 / 16;
            max-width: 96vw;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #hud {
            position: absolute;
            top: 8px; left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: clamp(12px, 3.4vw, 16px);
            text-shadow: 0 2px 4px #000;
            pointer-events: none;
        }
        #lives { letter-spacing: 4px; }
        #funFact {
            position: absolute;
            left: 14px; right: 14px; bottom: 96px;
            background: rgba(10, 12, 34, 0.88);
            border: 1px solid rgba(159, 216, 255, 0.55);
            border-radius: 10px;
            padding: 10px 14px;
            text-align: center;
            font-family: 'VaultUI', 'Courier New', Courier, monospace;
            font-size: clamp(11.5px, 3.4vw, 14px);
            line-height: 1.4;
            letter-spacing: 0.3px;
            color: #cdeaff;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s;
        }
        #funFact.show { opacity: 1; }
        #funFact.theme-l5 {
            background: linear-gradient(135deg, rgba(19, 160, 75, 0.28), rgba(141, 102, 141, 0.32)), rgba(10, 12, 34, 0.88);
            border-color: rgba(180, 140, 200, 0.65);
            box-shadow: 0 0 14px rgba(19, 239, 75, 0.3), 0 0 12px rgba(180, 120, 200, 0.35);
        }
        #levelUp {
            position: absolute;
            top: 40%; left: 0; right: 0;
            text-align: center;
            font-family: 'VaultUI', 'Courier New', Courier, monospace;
            font-size: clamp(20px, 7vw, 32px);
            letter-spacing: 2px;
            color: #ffe27a;
            text-shadow: 0 0 10px rgba(255, 210, 90, 0.8), 0 2px 4px #000;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        #levelUp.hidden { opacity: 0; }
        #fireBtn {
            position: absolute;
            right: 16px; bottom: 22px;
            width: 64px; height: 64px;
            border-radius: 50%;
            background: rgba(255,90,60,0.28);
            border: 2px solid rgba(255,140,110,0.8);
            color: #ffd9cc;
            font-size: 11px;
            display: flex; align-items: center; justify-content: center;
            text-align: center;
            touch-action: none;
        }
        #gameOver, #winScreen {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.72);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-align: center;
            padding: 0 20px;
        }
        #gameOver.hidden, #winScreen.hidden { display: none; }
        #gameOver h2 { margin: 0; color: #ff6b5e; font-size: clamp(20px, 6vw, 30px); }
        #gameOver p { margin: 0; color: #9fd8ff; font-size: clamp(12px, 3.6vw, 15px); }
        #winScreen h2 {
            margin: 0; color: #ffe27a; font-size: clamp(24px, 7vw, 34px);
            font-family: 'VaultUI', 'Courier New', Courier, monospace;
            text-shadow: 0 0 14px rgba(255, 210, 90, 0.7);
        }
        #winScreen p { margin: 0; color: #9fffc0; font-size: clamp(12px, 3.6vw, 15px); }
    </style>
</head>
<body>
<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
        <div id="score">SCORE 0 &middot; LV1</div>
        <div id="lives">&#9650;&#9650;&#9650;</div>
    </div>
    <div id="levelUp" class="hidden"></div>
    <div id="funFact"></div>
    <div id="fireBtn">FIRE</div>
    <div id="gameOver" class="hidden">
        <h2>SHIP DESTROYED</h2>
        <p id="finalScore"></p>
        <p>Tap to restart</p>
    </div>
    <div id="winScreen" class="hidden">
        <h2>YOU WIN!</h2>
        <p id="winFinalScore"></p>
        <p>Tap to play again</p>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Logical game coordinate space (everything below is written against this,
// regardless of screen size). The canvas's actual backing-store resolution
// is bumped up by devicePixelRatio so the art stays crisp on retina phone
// screens instead of getting blown up and looking blocky - the CSS size
// (set in the stylesheet, 100% of #game-container) is what actually
// determines how big it appears on screen.
const GAME_W = 405, GAME_H = 720;
const DPR = Math.max(1, window.devicePixelRatio || 1);
canvas.width = GAME_W * DPR;
canvas.height = GAME_H * DPR;
ctx.scale(DPR, DPR);

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const gameOverEl = document.getElementById('gameOver');
const finalScoreEl = document.getElementById('finalScore');
const winScreenEl = document.getElementById('winScreen');
const winFinalScoreEl = document.getElementById('winFinalScore');
const funFactEl = document.getElementById('funFact');
const levelUpEl = document.getElementById('levelUp');

function loadImage(src) {
    const img = new Image();
    img.src = src;
    return img;
}

// ---------- Parallax starfield background ----------
// Each level has its own 4-layer background set (same file names, one
// folder per level); leveling up swaps which images the existing layer
// objects point to without resetting their scroll position, so the
// transition is a palette swap, not a jump-cut.
const LAYER_SPEEDS = [0.15, 0.35, 0.55, 0.9];
const LAYER_FILES = ['layer1_nebula.png', 'layer2_planets.png', 'layer3_asteroids.png', 'layer4_sparkles.png'];
const LEVEL_BACKGROUND_DIRS = ['assets/backgrounds', 'assets/backgrounds/level2', 'assets/backgrounds/level3', 'assets/backgrounds/level4', 'assets/backgrounds/level5'];
const levelBackgroundSets = LEVEL_BACKGROUND_DIRS.map(dir => LAYER_FILES.map(f => loadImage(`${dir}/${f}`)));

const layers = LAYER_SPEEDS.map((speed, i) => ({ img: levelBackgroundSets[0][i], speed, y: 0 }));

function applyBackgroundSet(levelIndex) {
    const set = levelBackgroundSets[Math.min(levelIndex, levelBackgroundSets.length - 1)];
    layers.forEach((layer, i) => { layer.img = set[i]; });
}

function drawLayer(layer) {
    const img = layer.img;
    if (!img.complete || !img.naturalWidth) return;
    const scale = GAME_W / img.naturalWidth;
    const h = img.naturalHeight * scale;
    let y = layer.y % h;
    if (y > 0) y -= h;
    for (; y < GAME_H; y += h) {
        ctx.drawImage(img, 0, y, GAME_W, h);
    }
}
function updateLayers(dt) {
    layers.forEach(layer => { layer.y += layer.speed * (dt / 16); });
}

// ---------- Player ship ----------
// Five upgrade tiers. Each tier's engine flame is baked into its own set of
// composite frames (the hull is identical across a tier's frames - only the
// flame length/style changes), so instead of overlaying a separate flame
// sprite we just cycle the tier's own frame set and scale everything by the
// tier's known hull height, keeping the ship's apparent size constant no
// matter how long that tier's flame happens to be in a given frame.
const TIER_COUNT = 5;
const HULL_HEIGHT = [null, 860, 1683, 1070, 950, 971]; // 1-indexed, from each tier's standalone art
const TIER_FRAME_COUNTS = [null, 5, 4, 5, 5, 5];

const tierFrames = [null];
for (let t = 1; t <= TIER_COUNT; t++) {
    const frames = [];
    for (let i = 0; i < TIER_FRAME_COUNTS[t]; i++) {
        frames.push(loadImage(`assets/ship/tier${t}/frame_${i}.png`));
    }
    tierFrames.push(frames);
}

const SHIP_DISPLAY_HEIGHT = 68; // on-screen hull height in canvas px, same for every tier

const player = {
    x: GAME_W / 2,
    y: GAME_H - 110,
    tier: 1,
    level: 1,
    speed: 4.5,
    invulnUntil: 0,
};

// Levels 1-4 each take 100 points to reach; level 5 is the last one and
// takes 200 points to clear (so 400 to enter it, 600 total to win). Each
// level-up swaps in its own background palette (see levelBackgroundSets
// above) and hands out a "Did you know" card as the transition.
const LEVEL_START_SCORE = [0, 100, 200, 300, 400];
const WIN_SCORE = 600;
let levelUpHideTimer = null;
let won = false;

function checkLevelUp() {
    const newLevel = LEVEL_START_SCORE.filter(t => score >= t).length;
    if (newLevel <= player.level) return;
    player.level = newLevel;
    applyBackgroundSet(newLevel - 1);
    updateHud();

    levelUpEl.textContent = `★ LEVEL ${newLevel} ★`;
    levelUpEl.classList.remove('hidden');
    clearTimeout(levelUpHideTimer);
    levelUpHideTimer = setTimeout(() => levelUpEl.classList.add('hidden'), 2400);

    // Level 5's "Did you know" card picks up the purple/green from its own
    // background art instead of the default blue theme.
    funFactEl.classList.toggle('theme-l5', newLevel === 5);

    showDidYouKnow();
}

function checkWin() {
    if (won || score < WIN_SCORE) return;
    won = true;
    gameOver = true;
    for (let i = 0; i < 14; i++) {
        spawnExplosion(Math.random() * GAME_W, GAME_H * 0.15 + Math.random() * GAME_H * 0.6, 36 + Math.random() * 48);
    }
    winFinalScoreEl.textContent = 'Final score: ' + score;
    winScreenEl.classList.remove('hidden');
}

const FLAME_FRAME_MS = 70;
let flameFrame = 0;
let flameTimer = 0;
function updateFlame(dt) {
    flameTimer += dt;
    const count = TIER_FRAME_COUNTS[player.tier];
    while (flameTimer >= FLAME_FRAME_MS) {
        flameTimer -= FLAME_FRAME_MS;
        flameFrame = (flameFrame + 1) % count;
    }
}

function drawPlayer() {
    const frames = tierFrames[player.tier];
    const img = frames[flameFrame % frames.length];
    if (!img || !img.complete || !img.naturalWidth) return;
    // Blink while invulnerable after taking a hit.
    if (player.invulnUntil > performance.now() && Math.floor(performance.now() / 100) % 2 === 0) return;
    const scale = SHIP_DISPLAY_HEIGHT / HULL_HEIGHT[player.tier];
    const w = img.naturalWidth * scale;
    const h = img.naturalHeight * scale;
    ctx.drawImage(img, player.x - w / 2, player.y - SHIP_DISPLAY_HEIGHT / 2, w, h);
}

function clampPlayer() {
    const half = SHIP_DISPLAY_HEIGHT / 2;
    player.x = Math.min(GAME_W - half, Math.max(half, player.x));
    player.y = Math.min(GAME_H - half, Math.max(half, player.y));
}

// ---------- Bullets ----------
const bulletImg = loadImage('assets/fx/unused_layers/6b1e0621.png');
const BULLET_W = 10, BULLET_H = 26, BULLET_SPEED = 9;
let bullets = [];
let lastShot = 0;
const FIRE_COOLDOWN_MS = 240;

function tryFire(time) {
    if (time - lastShot < FIRE_COOLDOWN_MS) return;
    lastShot = time;
    bullets.push({ x: player.x, y: player.y - SHIP_DISPLAY_HEIGHT / 2 });
}
function updateBullets(dt) {
    bullets.forEach(b => { b.y -= BULLET_SPEED * (dt / 16); });
    bullets = bullets.filter(b => b.y > -BULLET_H);
}
function drawBullets() {
    bullets.forEach(b => {
        ctx.drawImage(bulletImg, b.x - BULLET_W / 2, b.y - BULLET_H / 2, BULLET_W, BULLET_H);
    });
}

// ---------- Meteors / space junk (the whole game: dodge them or shoot them) ----------
const asteroidImgs = [
    ...[0, 1, 2, 3, 4].map(i => loadImage(`assets/hazards/asteroid_${i}.png`)),
    ...[0, 1, 2, 3].map(i => loadImage(`assets/hazards/junk/frag_${i}.png`)),
];
const ASTEROID_DISPLAY = 46;
let asteroids = [];
let nextAsteroidAt = 0;

function spawnAsteroid(time) {
    const img = asteroidImgs[Math.floor(Math.random() * asteroidImgs.length)];
    asteroids.push({
        img,
        x: ASTEROID_DISPLAY / 2 + Math.random() * (GAME_W - ASTEROID_DISPLAY),
        y: -ASTEROID_DISPLAY,
        speed: 2 + Math.random() * 1.8,
        spin: (Math.random() - 0.5) * 0.04,
        angle: 0,
        r: ASTEROID_DISPLAY * 0.4,
    });
    nextAsteroidAt = time + 900 + Math.random() * 900;
}
function updateAsteroids(dt, time) {
    if (time > nextAsteroidAt) spawnAsteroid(time);
    asteroids.forEach(a => { a.y += a.speed * (dt / 16); a.angle += a.spin * (dt / 16); });
    asteroids = asteroids.filter(a => a.y < GAME_H + ASTEROID_DISPLAY);
}
function drawAsteroids() {
    asteroids.forEach(a => {
        const img = a.img;
        if (!img.complete || !img.naturalWidth) return;
        const scale = ASTEROID_DISPLAY / Math.max(img.naturalWidth, img.naturalHeight);
        const w = img.naturalWidth * scale, h = img.naturalHeight * scale;
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.angle);
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
        ctx.restore();
    });
}

// "Did you know" cards - shown as a brief intermission each time you level
// up (see checkLevelUp above), never as text sitting in front of live
// gameplay.
const DID_YOU_KNOW = [
    "Did you know? A “shooting star” isn't a rock at all - it's the glowing streak a meteoroid makes burning up in our atmosphere. A piece that survives to hit the ground is called a meteorite.",
    "Did you know? The asteroid belt between Mars and Jupiter holds millions of rocks, but all of them combined would still be smaller than Earth's Moon.",
    "Did you know? The asteroid 16 Psyche is made mostly of iron and nickel - scientists think its metal could be worth more than our entire global economy.",
    "Did you know? Tens of thousands of tracked pieces of space junk circle Earth at up to 17,500 mph - fast enough that even a fleck of paint can damage a spacecraft.",
    "Did you know? The first satellite, Sputnik 1, launched in 1957. It was about the size of a beach ball and circled Earth in just 96 minutes.",
    "Did you know? Dead satellites get nudged up into a “graveyard orbit” - a safe zone far above the satellites still working.",
    "Did you know? Space is a near-vacuum, so sound has nothing to travel through - it's completely silent out there.",
    "Did you know? NASA probes pick up real plasma waves and radio signals from planets and turn them into eerie sounds we can actually hear.",
    "Did you know? Light travels so fast, yet space is so big, that we see the Moon as it looked 1.3 seconds ago - and the Sun as it looked over 8 minutes ago.",
    "Did you know? There are over 30,000 pieces of tracked space debris circling Earth right now.",
    "Did you know? About 3,000 working satellites are orbiting Earth as you play this.",
    "Did you know? The International Space Station sometimes has to steer around space junk.",
    "Did you know? Even a piece of space junk as small as a marble can damage a satellite.",
    "Did you know? Astronauts on the ISS see 16 sunrises and sunsets every single day.",
    "Did you know? The Moon drifts about 1.5 inches farther from Earth every year.",
    "Did you know? One day on Venus is longer than one whole year on Venus.",
];
let factQueue = [];
let factPos = 0;
let funFactHideTimer = null;
function buildFactQueue() {
    factQueue = shuffle(DID_YOU_KNOW.map((_, i) => i));
    factPos = 0;
}
function showDidYouKnow() {
    if (factPos >= factQueue.length) buildFactQueue();
    funFactEl.textContent = DID_YOU_KNOW[factQueue[factPos++]];
    funFactEl.classList.add('show');
    clearTimeout(funFactHideTimer);
    funFactHideTimer = setTimeout(() => funFactEl.classList.remove('show'), 4800);
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// ---------- Explosions (brief effect on hit/kill) ----------
const EXPLOSION_FRAME_COUNT = 10;
const explosionFrames = Array.from({ length: EXPLOSION_FRAME_COUNT }, (_, i) =>
    loadImage(`assets/fx/explosion_anim/frame_${i}.png`));
const EXPLOSION_DURATION_MS = 380;
let explosions = [];
function spawnExplosion(x, y, size) {
    explosions.push({ x, y, size, start: performance.now() });
}
function drawExplosions(time) {
    explosions = explosions.filter(e => time - e.start < EXPLOSION_DURATION_MS);
    explosions.forEach(e => {
        const t = (time - e.start) / EXPLOSION_DURATION_MS;
        const frame = Math.max(0, Math.min(EXPLOSION_FRAME_COUNT - 1, Math.floor(t * EXPLOSION_FRAME_COUNT)));
        const img = explosionFrames[frame];
        if (!img.complete || !img.naturalWidth) return;
        ctx.drawImage(img, e.x - e.size / 2, e.y - e.size / 2, e.size, e.size);
    });
}

// ---------- Score / lives / game state ----------
let score = 0;
let lives = 3;
let gameOver = false;
function updateHud() {
    scoreEl.textContent = `SCORE ${score} · LV${player.level}`;
    livesEl.textContent = '▲'.repeat(Math.max(0, lives));
}

function loseLife(time) {
    if (player.invulnUntil > time) return;
    lives -= 1;
    player.invulnUntil = time + 1500;
    updateHud();
    if (lives <= 0) {
        gameOver = true;
        finalScoreEl.textContent = 'Score: ' + score;
        gameOverEl.classList.remove('hidden');
    }
}

function resetGame() {
    score = 0;
    lives = 3;
    gameOver = false;
    won = false;
    player.x = GAME_W / 2;
    player.y = GAME_H - 110;
    player.tier = 1;
    player.level = 1;
    player.invulnUntil = 0;
    applyBackgroundSet(0);
    levelUpEl.classList.add('hidden');
    clearTimeout(levelUpHideTimer);
    bullets = [];
    asteroids = [];
    explosions = [];
    nextAsteroidAt = 0;
    buildFactQueue();
    funFactEl.classList.remove('show');
    funFactEl.classList.remove('theme-l5');
    clearTimeout(funFactHideTimer);
    updateHud();
    gameOverEl.classList.add('hidden');
    winScreenEl.classList.add('hidden');
}

function circleHit(ax, ay, ar, bx, by, br) {
    const dx = ax - bx, dy = ay - by;
    return dx * dx + dy * dy < (ar + br) * (ar + br);
}

function resolveCollisions(time) {
    const playerR = SHIP_DISPLAY_HEIGHT * 0.32;

    // Player vs meteors/space junk
    asteroids.forEach(a => {
        if (circleHit(player.x, player.y, playerR, a.x, a.y, a.r)) {
            loseLife(time);
            spawnExplosion(a.x, a.y, ASTEROID_DISPLAY);
            a.y = GAME_H + 999; // remove next filter pass
        }
    });

    // Bullets vs meteors/space junk - the whole game: shoot them for points.
    bullets.forEach(b => {
        asteroids.forEach(a => {
            if (circleHit(b.x, b.y, 4, a.x, a.y, a.r)) {
                score += 10;
                spawnExplosion(a.x, a.y, ASTEROID_DISPLAY);
                a.y = GAME_H + 999;
                b.y = -999;
                updateHud();
                checkLevelUp();
                checkWin();
            }
        });
    });

    bullets = bullets.filter(b => b.y > -999);
    asteroids = asteroids.filter(a => a.y < GAME_H + 900);
}

// ---------- Input ----------
// Keyboard: arrows or WASD to fly, space to fire, 1-5 to preview a tier
// (a stand-in for real power-up pickups, which aren't built yet).
const keys = { up: false, down: false, left: false, right: false, fire: false };
window.addEventListener('keydown', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === ' ') keys.fire = true;
    if (['1','2','3','4','5'].includes(e.key)) { player.tier = parseInt(e.key, 10); flameFrame = 0; }
});
window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    if (e.key === ' ') keys.fire = false;
});

// Touch/mouse: drag anywhere on the canvas to fly the ship straight to
// the pointer, in canvas-space coordinates (accounts for CSS scaling).
let dragging = false;
function pointerToCanvas(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (clientX - rect.left) * (GAME_W / rect.width),
        y: (clientY - rect.top) * (GAME_H / rect.height),
    };
}
canvas.addEventListener('pointerdown', (e) => {
    dragging = true;
    const p = pointerToCanvas(e.clientX, e.clientY);
    player.x = p.x; player.y = p.y;
});
canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const p = pointerToCanvas(e.clientX, e.clientY);
    player.x = p.x; player.y = p.y;
});
window.addEventListener('pointerup', () => { dragging = false; });

const fireBtn = document.getElementById('fireBtn');
fireBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); keys.fire = true; });
fireBtn.addEventListener('pointerup', (e) => { e.preventDefault(); keys.fire = false; });
fireBtn.addEventListener('pointercancel', () => { keys.fire = false; });

gameOverEl.addEventListener('pointerdown', (e) => { e.preventDefault(); resetGame(); });
winScreenEl.addEventListener('pointerdown', (e) => { e.preventDefault(); resetGame(); });

function updatePlayer(dt) {
    const move = player.speed * (dt / 16);
    if (keys.up) player.y -= move;
    if (keys.down) player.y += move;
    if (keys.left) player.x -= move;
    if (keys.right) player.x += move;
    clampPlayer();
}

function render(time) {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    layers.forEach(drawLayer);
    drawAsteroids();
    drawBullets();
    drawPlayer();
    drawExplosions(time);
}

let lastTime = 0;
function loop(time) {
    const dt = lastTime ? Math.min(time - lastTime, 48) : 16;
    lastTime = time;

    if (!gameOver) {
        updateLayers(dt);
        updatePlayer(dt);
        updateFlame(dt);
        if (keys.fire) tryFire(time);
        updateBullets(dt);
        updateAsteroids(dt, time);
        resolveCollisions(time);
    }
    render(time);
    requestAnimationFrame(loop);
}
buildFactQueue();
updateHud();
requestAnimationFrame(loop);
</script>
</body>
</html>
