<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Space Fight</title>
    <style>
        html {
            height: 100%;
            overscroll-behavior: none;
        }
        body {
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }
        #game-container {
            position: relative;
            height: 96dvh;
            aspect-ratio: 9 / 16;
            max-width: 96vw;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #placeholder-note {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 18px;
            text-align: center;
            font-size: clamp(11px, 3vw, 14px);
            color: #9fd8ff;
            text-shadow: 0 2px 4px #000;
            padding: 0 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="game-container">
    <canvas id="gameCanvas" width="405" height="720"></canvas>
    <div id="placeholder-note">Drag or arrow keys to fly &middot; keys 1-4 preview upgrade tiers &middot; enemies not in yet</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ---------- Parallax starfield background ----------
// Four layers, all the same 1080x1920 canvas, stacked back to front:
// nebula (opaque, slowest) -> planets -> asteroids -> sparkles (fastest).
// Each scrolls straight down continuously and wraps seamlessly by
// drawing two copies of itself one canvas-height apart.
const layers = [];
function loadLayer(src, speed) {
    const img = new Image();
    img.src = src;
    layers.push({ img, speed, y: 0 });
}
loadLayer('assets/backgrounds/layer1_nebula.png', 0.15);
loadLayer('assets/backgrounds/layer2_planets.png', 0.35);
loadLayer('assets/backgrounds/layer3_asteroids.png', 0.55);
loadLayer('assets/backgrounds/layer4_sparkles.png', 0.9);

function drawLayer(layer) {
    const img = layer.img;
    if (!img.complete || !img.naturalWidth) return;

    // Scale the source image to fill the canvas width, keep its aspect ratio.
    const scale = canvas.width / img.naturalWidth;
    const h = img.naturalHeight * scale;

    let y = layer.y % h;
    if (y > 0) y -= h;
    for (; y < canvas.height; y += h) {
        ctx.drawImage(img, 0, y, canvas.width, h);
    }
}

function updateLayers() {
    layers.forEach(layer => { layer.y += layer.speed; });
}

// ---------- Player ship ----------
// Four upgrade tiers - the ship's look changes as the player powers up.
// Ordered by how armed/aggressive each design reads: 1 is the plain
// starting hull, 4 is the heaviest (visible triple cannons on each wing).
const SHIP_TIER_SRC = [
    null, // tiers are 1-indexed to match the in-game upgrade count
    'assets/ship/ship_tier1.png',
    'assets/ship/ship_tier2.png',
    'assets/ship/ship_tier3.png',
    'assets/ship/ship_tier4.png',
];
const shipImages = SHIP_TIER_SRC.map(src => {
    if (!src) return null;
    const img = new Image();
    img.src = src;
    return img;
});
const SHIP_DISPLAY_HEIGHT = 68; // on-screen height in canvas px, same for every tier

const player = {
    x: canvas.width / 2,
    y: canvas.height - 110,
    tier: 1,
    speed: 4.5, // px/frame for keyboard movement
};

function drawPlayer() {
    const img = shipImages[player.tier];
    if (!img || !img.complete || !img.naturalWidth) return;
    const scale = SHIP_DISPLAY_HEIGHT / img.naturalHeight;
    const w = img.naturalWidth * scale;
    const h = SHIP_DISPLAY_HEIGHT;
    ctx.drawImage(img, player.x - w / 2, player.y - h / 2, w, h);
}

function clampPlayer() {
    const half = SHIP_DISPLAY_HEIGHT / 2;
    player.x = Math.min(canvas.width - half, Math.max(half, player.x));
    player.y = Math.min(canvas.height - half, Math.max(half, player.y));
}

// Keyboard: arrows or WASD to fly, 1-4 to preview an upgrade tier (a
// stand-in for real power-up pickups, which aren't built yet).
const keys = { up: false, down: false, left: false, right: false };
window.addEventListener('keydown', (e) => {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = true;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = true;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (['1','2','3','4'].includes(e.key)) player.tier = parseInt(e.key, 10);
});
window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});

// Touch/mouse: drag anywhere on the canvas to fly the ship straight to
// the pointer, in canvas-space coordinates (accounts for CSS scaling).
let dragging = false;
function pointerToCanvas(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height),
    };
}
canvas.addEventListener('pointerdown', (e) => {
    dragging = true;
    const p = pointerToCanvas(e.clientX, e.clientY);
    player.x = p.x; player.y = p.y;
});
canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const p = pointerToCanvas(e.clientX, e.clientY);
    player.x = p.x; player.y = p.y;
});
window.addEventListener('pointerup', () => { dragging = false; });

function updatePlayer() {
    if (keys.up) player.y -= player.speed;
    if (keys.down) player.y += player.speed;
    if (keys.left) player.x -= player.speed;
    if (keys.right) player.x += player.speed;
    clampPlayer();
}

function render() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    layers.forEach(drawLayer);
    drawPlayer();
}

function loop() {
    updateLayers();
    updatePlayer();
    render();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
